name = "freigen"
version = "0.1.0"
defaultTargets = ["Freigen", "freigen"]

[[lean_lib]]
name = "Freigen"
# Build every Freigen.* module, imported by the umbrella or not — an orphan
# module must fail CI rather than silently go unchecked.
globs = ["Freigen", "Freigen.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_exe]]
name = "freigen"
root = "Main"
